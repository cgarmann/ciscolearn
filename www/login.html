<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://appleid.cdn-apple.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: https:;
    connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://www.googleapis.com https://appleid.apple.com https://*.apple.com;
    frame-src https://*.firebaseapp.com https://accounts.google.com https://appleid.apple.com https://*.apple.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self' https://appleid.apple.com;
  " />
  <title>NetCLI:Learn — Sign in</title>
  <meta name="theme-color" content="#00ff88" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <script src="js/capacitor.js"></script>
  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NetCLI" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700&display=swap" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0d1117; --s1:#161b22; --s2:#21262d; --border:#30363d;
  --text:#e6edf3; --muted:#7d8590; --accent:#00ff88; --red:#f85149;
  --r:6px;
}
body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }

.card { background:var(--s1); border:1px solid var(--border); border-radius:12px; width:100%; max-width:420px; padding:2.5rem 2rem; }

.logo { font-family:'JetBrains Mono',monospace; font-size:1.25rem; font-weight:700; color:var(--text); text-align:center; margin-bottom:.4rem; }
.logo span { color:var(--accent); }
.tagline { font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--muted); text-align:center; margin-bottom:2rem; letter-spacing:.06em; }

.tabs { display:flex; gap:.5rem; margin-bottom:1.8rem; background:var(--bg); border-radius:var(--r); padding:3px; }
.tab { flex:1; background:none; border:none; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:.78rem; font-weight:600; padding:.55rem; border-radius:4px; cursor:pointer; transition:all .15s; }
.tab.active { background:var(--s2); color:var(--accent); }

.form-group { margin-bottom:1rem; }
label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:.4rem; font-family:'JetBrains Mono',monospace; }
input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--r); color:var(--text); font-family:'DM Sans',sans-serif; font-size:.93rem; padding:.65rem .85rem; outline:none; transition:border-color .15s; }
input:focus { border-color:var(--accent); }
input::placeholder { color:var(--muted); }

.btn { width:100%; padding:.75rem; border:none; border-radius:var(--r); font-family:'JetBrains Mono',monospace; font-size:.85rem; font-weight:700; cursor:pointer; transition:all .15s; margin-top:.5rem; }
.btn-primary { background:var(--accent); color:#0d1117; }
.btn-primary:hover { opacity:.88; }
.btn-primary:disabled { opacity:.45; cursor:default; }
.btn-google { background:var(--s2); color:var(--text); border:1px solid var(--border); margin-top:.75rem; display:flex; align-items:center; justify-content:center; gap:.6rem; }
.btn-google:hover { border-color:var(--muted); }

.divider { display:flex; align-items:center; gap:.75rem; margin:1.25rem 0; }
.divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
.divider span { font-size:.72rem; color:var(--muted); font-family:'JetBrains Mono',monospace; white-space:nowrap; }

.error-msg { background:rgba(248,81,73,.12); border:1px solid rgba(248,81,73,.3); border-radius:var(--r); color:var(--red); font-size:.82rem; padding:.6rem .85rem; margin-bottom:1rem; display:none; }
.error-msg.show { display:block; }

.forgot { text-align:right; margin-top:.3rem; }
.forgot a { font-size:.78rem; color:var(--muted); text-decoration:none; font-family:'JetBrains Mono',monospace; }
.forgot a:hover { color:var(--accent); }

.reset-msg { background:rgba(0,255,136,.08); border:1px solid rgba(0,255,136,.2); border-radius:var(--r); color:var(--accent); font-size:.82rem; padding:.6rem .85rem; margin-bottom:1rem; display:none; }
.reset-msg.show { display:block; }

.google-icon { width:18px; height:18px; }
body.is-native .native-hidden { display:none !important; }
body:not(.is-native-ios) .ios-only { display:none !important; }
.btn-apple { background:#000; color:#fff; border:1px solid #333; margin-top:.75rem; display:flex; align-items:center; justify-content:center; gap:.6rem; }
.btn-apple:hover { background:#1a1a1a; }
</style>
</head>
<style>
.auth-checking { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; min-height:120px; }
.spinner { width:28px; height:28px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
<body>
<div class="card" id="authCard" style="visibility:hidden">
  <div id="authChecking" class="auth-checking">
    <div class="spinner"></div>
  </div>
  <div id="authContent" style="display:none">
  <div class="logo">NetCLI<span>:Learn</span></div>
  <div class="tagline">> sign in to sync your progress</div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('login')">Sign In</button>
    <button class="tab" onclick="showTab('register')">Register</button>
  </div>

  <div id="errorMsg" class="error-msg"></div>
  <div id="resetMsg" class="reset-msg"></div>

  <!-- LOGIN FORM -->
  <div id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" maxlength="254" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" maxlength="256" />
      <div class="forgot"><a href="#" onclick="showForgot(event)">Forgot password?</a></div>
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Sign In</button>
    <div class="divider native-hidden"><span>or</span></div>
    <button class="btn btn-google native-hidden" onclick="doGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <button class="btn btn-apple ios-only" onclick="doApple()">
      <svg width="18" height="18" viewBox="0 0 814 1000" fill="white"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 376.8 47 280.8 47 256c0-178.8 117.2-273.5 232.5-273.5 61.9 0 113.2 40.8 151.8 40.8 36.8 0 94.7-43.7 163.6-43.7 25.5 0 108.2 2.6 165.2 78.5zM564.8 47.7c29-34.5 50.1-82.5 50.1-130.6 0-6.5-.6-13.1-1.9-18.4-47.5 1.9-103.1 31.7-137 68.5-25.5 28.4-50.8 76.4-50.8 127.4 0 7.1 1.3 14.3 1.9 16.6 3.2.6 8.4 1.3 13.6 1.3 43.1 0 91.7-28.4 124.1-64.8z"/></svg>
      Continue with Apple
    </button>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerForm" style="display:none">
    <div class="form-group">
      <label>Display name</label>
      <input type="text" id="regName" placeholder="Your name" autocomplete="name" maxlength="40" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" maxlength="254" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" placeholder="Min. 8 characters (letters + digit)" autocomplete="new-password" minlength="8" maxlength="128" />
    </div>
    <button class="btn btn-primary" id="registerBtn" onclick="doRegister()">Create Account</button>
    <div class="divider native-hidden"><span>or</span></div>
    <button class="btn btn-google native-hidden" onclick="doGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <button class="btn btn-apple ios-only" onclick="doApple()">
      <svg width="18" height="18" viewBox="0 0 814 1000" fill="white"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 376.8 47 280.8 47 256c0-178.8 117.2-273.5 232.5-273.5 61.9 0 113.2 40.8 151.8 40.8 36.8 0 94.7-43.7 163.6-43.7 25.5 0 108.2 2.6 165.2 78.5zM564.8 47.7c29-34.5 50.1-82.5 50.1-130.6 0-6.5-.6-13.1-1.9-18.4-47.5 1.9-103.1 31.7-137 68.5-25.5 28.4-50.8 76.4-50.8 127.4 0 7.1 1.3 14.3 1.9 16.6 3.2.6 8.4 1.3 13.6 1.3 43.1 0 91.7-28.4 124.1-64.8z"/></svg>
      Continue with Apple
    </button>
  </div>
  </div><!-- /authContent -->
</div><!-- /card -->

<script type="module">
import { signInEmail, registerEmail, signInGoogle, signInApple, onAuth } from './js/auth.js';

if (window.Capacitor?.isNativePlatform()) {
  document.body.classList.add('is-native');
  if (window.Capacitor.getPlatform() === 'ios') {
    document.body.classList.add('is-native-ios');
  }
}

window.showTab = function(tab) {
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'login')));
  clearMessages();
};

window.showForgot = async function(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) { showError('Enter your email address first.'); return; }
  const { resetPassword } = await import('./js/auth.js');
  const { error } = await resetPassword(email);
  if (error) showError(error);
  else showReset('Password reset email sent — check your inbox.');
};

window.doLogin = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { showError('Please fill in all fields.'); return; }
  if (email.length > 254 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Invalid email format.'); return; }
  if (password.length > 256) { showError('Password too long.'); return; }
  setLoading('loginBtn', true);
  const { user, error } = await signInEmail(email, password);
  if (error) { showError(error); setLoading('loginBtn', false); return; }
  if (user) goToApp();
  else { showError('Login did not complete. Please try again.'); setLoading('loginBtn', false); }
};

window.doRegister = async function() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) { showError('Please fill in all fields.'); return; }
  if (name.length > 40) { showError('Display name is too long (max 40 characters).'); return; }
  if (!/^[\p{L}\p{N} '.\-_]+$/u.test(name)) { showError('Display name can only contain letters, digits, spaces and - . _ \''); return; }
  if (email.length > 254 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Invalid email format.'); return; }
  if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
  if (password.length > 128) { showError('Password too long (max 128 characters).'); return; }
  if (!/[A-Za-z]/.test(password) || !/\d/.test(password)) { showError('Password must contain letters and at least one digit.'); return; }
  setLoading('registerBtn', true);
  const { user, error } = await registerEmail(email, password, name);
  if (error) { showError(error); setLoading('registerBtn', false); return; }
  if (user) goToApp();
  else { showError('Account creation did not complete. Please try again.'); setLoading('registerBtn', false); }
};

window.doGoogle = async function() {
  const { user, error } = await signInGoogle();
  if (error && !error.includes('popup-closed')) { showError(error); return; }
  if (user) goToApp();
};

window.doApple = async function() {
  const { user, error } = await signInApple();
  if (error) { showError(error); return; }
  if (user) goToApp();
};

function goToApp() {
  localStorage.setItem('cl-launched', '1');
  setTimeout(() => {
    showLoginForm();
    showError('The app did not open. Please try again.');
    setLoading('loginBtn', false);
    setLoading('registerBtn', false);
  }, 5000);
  window.location.replace('index.html');
}

function showLoginForm() {
  document.getElementById('authChecking').style.display = 'none';
  document.getElementById('authContent').style.display = 'block';
  document.getElementById('authCard').style.visibility = 'visible';
}

const authTimeout = setTimeout(showLoginForm, 8000);
onAuth(user => {
  clearTimeout(authTimeout);
  if (user) {
    goToApp();
  } else {
    showLoginForm();
  }
});

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}
function showReset(msg) {
  const el = document.getElementById('resetMsg');
  el.textContent = msg;
  el.classList.add('show');
}
function clearMessages() {
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('resetMsg').classList.remove('show');
}
function setLoading(id, loading) {
  const btn = document.getElementById(id);
  btn.disabled = loading;
  btn.textContent = loading ? 'Please wait…' : (id === 'loginBtn' ? 'Sign In' : 'Create Account');
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const active = document.getElementById('loginForm').style.display !== 'none' ? 'login' : 'register';
    if (active === 'login') window.doLogin();
    else window.doRegister();
  }
});
</script>
</body>
</html>
