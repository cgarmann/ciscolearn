workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - apple_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.schjoldr.netcli
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: latest

    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps

      - name: Capacitor add & sync iOS
        script: |
          npx cap add ios
          npx cap sync ios
          cp assets/AppIcon-512@2x.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Set build version
        script: |
          sed -i '' 's/$(CURRENT_PROJECT_VERSION)/5/g' ios/App/App/Info.plist
          echo "=== CFBundleVersion ==="
          grep -A1 CFBundleVersion ios/App/App/Info.plist

      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files io.schjoldr.netcli \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
