workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - apple_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.schjoldr.netcli
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: latest

    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps

      - name: Patch apple-sign-in for Capacitor 8
        script: |
          sed -i '' 's/from: "7.0.0"/from: "8.0.0"/' node_modules/@capacitor-community/apple-sign-in/Package.swift

      - name: Write Firebase config
        script: echo "$FIREBASE_CONFIG_JS" > www/js/firebase-config.js

      - name: Copy Capacitor config files
        script: |
          cp capacitor.config.json ios/App/App/capacitor.config.json
          cat > ios/App/App/config.xml << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget version="1.3" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>NetCLI</name>
            <content src="index.html" />
            <access origin="*" />
          </widget>
          EOF

      - name: Copy web assets
        script: rsync -av --delete www/ ios/App/App/public/

      - name: Set build version
        script: |
          sed -i '' 's/$(CURRENT_PROJECT_VERSION)/16/g' ios/App/App/Info.plist
          echo "=== CFBundleVersion after sed ==="
          grep -A1 CFBundleVersion ios/App/App/Info.plist

      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Apply provisioning profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
