workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - apple_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.schjoldr.netcli
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: latest

    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps

      - name: Copy web assets
        script: rsync -av --delete www/ ios/App/App/public/

      - name: Set build version
        script: |
          sed -i '' 's/$(CURRENT_PROJECT_VERSION)/7/g' ios/App/App/Info.plist
          echo "=== CFBundleVersion after sed ==="
          grep -A1 CFBundleVersion ios/App/App/Info.plist

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files io.schjoldr.netcli \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
