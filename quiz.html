<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — CiscoLearn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">
  <section class="hero">
    <div class="container">
      <p class="hero-eyebrow">// 05 — quiz</p>
      <h1>Test Your <em>Knowledge</em></h1>
      <p>Multiple-choice questions on Cisco networking. 20 questions, randomized order.</p>
    </div>
  </section>

  <section class="section">
    <div class="container-sm">

      <!-- Start screen -->
      <div id="startScreen">
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:2rem;">
          <button class="btn btn-primary" onclick="startQuiz('all')">All Topics</button>
          <button class="btn btn-ghost" onclick="startQuiz('subnetting')">Subnetting</button>
          <button class="btn btn-ghost" onclick="startQuiz('vlan')">VLANs</button>
          <button class="btn btn-ghost" onclick="startQuiz('routing')">Routing</button>
          <button class="btn btn-ghost" onclick="startQuiz('commands')">Commands</button>
          <button class="btn btn-ghost" onclick="startQuiz('security')">Security</button>
        </div>
        <div class="card-grid" id="statsGrid"></div>
      </div>

      <!-- Quiz screen -->
      <div id="quizScreen" style="display:none;">
        <div class="quiz-progress"><div class="quiz-progress-bar" id="progressBar"></div></div>
        <p style="font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--muted);margin-bottom:1.5rem;" id="questionCounter"></p>
        <div class="card" style="margin-bottom:1.5rem;">
          <p style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--accent);margin-bottom:0.75rem;" id="questionCat"></p>
          <h3 style="font-family:'DM Sans',sans-serif;font-size:1.05rem;font-weight:500;margin-bottom:1.25rem;line-height:1.5;" id="questionText"></h3>
          <div id="optionsContainer"></div>
          <div id="quizFeedback"></div>
        </div>
        <button class="btn btn-primary" id="nextBtn" style="display:none;" onclick="nextQuestion()">Next →</button>
      </div>

      <!-- Score screen -->
      <div id="scoreScreen" style="display:none;">
        <div class="score-display">
          <div class="score-big" id="finalScore"></div>
          <div class="score-label" id="scoreLabel"></div>
          <p style="color:var(--muted);margin-top:1rem;font-size:0.88rem;" id="scoreMsg"></p>
          <div style="margin-top:2rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="startQuiz(lastCategory)">Try Again</button>
            <button class="btn btn-ghost" onclick="showStart()">Back to Menu</button>
          </div>
        </div>
        <div id="reviewList" style="margin-top:2rem;"></div>
      </div>

    </div>
  </section>
</div>

<script src="nav.js"></script>
<script>
const ALL_QUESTIONS = [
  // Subnetting
  { cat:'subnetting', q:'What is the network address of 192.168.1.130/26?',
    opts:['192.168.1.0','192.168.1.128','192.168.1.64','192.168.1.192'], ans:1,
    explain:'A /26 mask (255.255.255.192) creates blocks of 64. 130 falls in the block starting at 128.' },
  { cat:'subnetting', q:'How many usable host addresses does a /28 subnet provide?',
    opts:['14','16','30','12'], ans:0,
    explain:'2^4 = 16 total addresses minus 2 (network + broadcast) = 14 usable hosts.' },
  { cat:'subnetting', q:'What is the broadcast address of 10.0.0.0/30?',
    opts:['10.0.0.1','10.0.0.2','10.0.0.3','10.0.0.4'], ans:2,
    explain:'/30 has 4 addresses: .0 (network), .1, .2 (hosts), .3 (broadcast).' },
  { cat:'subnetting', q:'Which subnet mask is equivalent to /25?',
    opts:['255.255.255.0','255.255.255.128','255.255.255.192','255.255.254.0'], ans:1,
    explain:'/25 = 25 ones in binary = 255.255.255.128.' },
  { cat:'subnetting', q:'A /30 subnet is typically used for what type of link?',
    opts:['Large LAN','WAN point-to-point','Server farm','Wireless access'], ans:1,
    explain:'/30 gives exactly 2 usable hosts — perfect for connecting two router interfaces.' },
  { cat:'subnetting', q:'What is the wildcard mask for /24?',
    opts:['255.255.255.0','0.0.0.0','0.0.0.255','255.0.0.0'], ans:2,
    explain:'Wildcard mask is the inverse of the subnet mask. /24 = 255.255.255.0, so wildcard = 0.0.0.255.' },
  { cat:'subnetting', q:'How many subnets does 192.168.1.0/24 split into if you subnet to /26?',
    opts:['2','4','8','6'], ans:1,
    explain:'2^(26-24) = 2^2 = 4 subnets, each with 64 addresses.' },

  // VLANs
  { cat:'vlan', q:'What command assigns a switch port to VLAN 20?',
    opts:['switchport vlan 20','switchport access vlan 20','vlan access 20','set vlan 20'], ans:1,
    explain:'"switchport access vlan <id>" assigns the port to the specified VLAN after setting it to access mode.' },
  { cat:'vlan', q:'What is the purpose of a trunk port?',
    opts:['Carry one VLAN only','Connect to end devices','Carry multiple VLANs between switches','Block unauthorized VLANs'], ans:2,
    explain:'Trunk ports use 802.1Q tagging to carry traffic from multiple VLANs on a single link.' },
  { cat:'vlan', q:'What is an SVI (Switched Virtual Interface)?',
    opts:['A physical switch port','A virtual interface used as a VLAN gateway on an L3 switch','A WAN serial interface','A loopback address'], ans:1,
    explain:'SVIs (interface vlan <id>) act as Layer 3 gateways for VLANs on multilayer switches.' },
  { cat:'vlan', q:'Which command enables Layer 3 routing on a Catalyst 3560 switch?',
    opts:['enable routing','ip routing','switchport routing enable','route enable'], ans:1,
    explain:'"ip routing" must be enabled on multilayer switches before they can route between VLANs.' },
  { cat:'vlan', q:'Which protocol is used for VLAN tagging on trunk links?',
    opts:['ISL','802.1Q','802.3','CDP'], ans:1,
    explain:'IEEE 802.1Q is the industry standard for VLAN tagging. ISL is a Cisco proprietary alternative (now deprecated).' },

  // Routing
  { cat:'routing', q:'What does a "gateway of last resort" mean in a routing table?',
    opts:['The fastest route','The default route used when no specific match exists','The route with the lowest metric','The directly connected route'], ans:1,
    explain:'A default route (0.0.0.0/0) is used for traffic that doesn\'t match any more specific entry — the fallback.' },
  { cat:'routing', q:'Which command adds a default route via next-hop 10.0.0.1?',
    opts:['ip route default 10.0.0.1','ip route 0.0.0.0 0.0.0.0 10.0.0.1','ip default-route 10.0.0.1','route 0.0.0.0/0 10.0.0.1'], ans:1,
    explain:'ip route 0.0.0.0 0.0.0.0 <next-hop> is the standard syntax for a default route in IOS.' },
  { cat:'routing', q:'In OSPF, what does "passive-interface" do?',
    opts:['Shuts down the interface','Stops OSPF hellos on that interface while still advertising the network','Removes the network from OSPF','Increases OSPF cost'], ans:1,
    explain:'passive-interface prevents OSPF from forming adjacencies on that interface but still advertises it as a connected network.' },
  { cat:'routing', q:'What is the administrative distance of OSPF?',
    opts:['90','110','120','1'], ans:1,
    explain:'OSPF has an AD of 110. Lower AD = more trusted. Connected routes = 0, Static = 1, EIGRP = 90, OSPF = 110, RIP = 120.' },
  { cat:'routing', q:'What does the "O" prefix in a routing table entry indicate?',
    opts:['Default route','Directly connected','OSPF-learned route','Old/outdated route'], ans:2,
    explain:'"O" marks routes learned via OSPF. C = connected, S = static, D = EIGRP, R = RIP.' },

  // Commands
  { cat:'commands', q:'What does "no shutdown" do on a router interface?',
    opts:['Disables the interface','Enables the interface','Removes the IP address','Resets the counters'], ans:1,
    explain:'Router interfaces are shutdown by default. "no shutdown" administratively enables them.' },
  { cat:'commands', q:'Which command shows a summary of all interface statuses and IP addresses?',
    opts:['show interfaces','show ip route','show ip interface brief','show running-config'], ans:2,
    explain:'"show ip interface brief" gives a compact table of all interfaces, their IPs, and up/down status.' },
  { cat:'commands', q:'What is the effect of "no ip domain-lookup"?',
    opts:['Disables DNS resolution for clients','Prevents the router from attempting DNS resolution for mistyped commands','Removes the domain name','Disables DHCP'], ans:1,
    explain:'Without this, mistyped commands trigger a DNS lookup that pauses the CLI for 30+ seconds.' },
  { cat:'commands', q:'What does "copy running-config startup-config" do?',
    opts:['Loads saved config','Saves current config to NVRAM','Backs up to TFTP','Compares configs'], ans:1,
    explain:'This saves the active running-config to NVRAM so it persists across reboots.' },

  // Security
  { cat:'security', q:'What is required before generating RSA keys for SSH?',
    opts:['An ACL must be applied','Hostname and domain-name must be set','VTY lines must be configured','Enable secret must be set'], ans:1,
    explain:'"crypto key generate rsa" requires a hostname and ip domain-name to be configured first.' },
  { cat:'security', q:'What does "transport input ssh" on a VTY line do?',
    opts:['Enables SSH and Telnet','Disables SSH','Allows only SSH — blocks Telnet','Requires a certificate'], ans:2,
    explain:'Telnet sends credentials in plaintext. Restricting VTY lines to SSH only is a basic security hardening step.' },
  { cat:'security', q:'What is the difference between "enable password" and "enable secret"?',
    opts:['They are identical','enable secret uses MD5 encryption; enable password is stored in plaintext by default','enable password is more secure','enable secret only works on switches'], ans:1,
    explain:'Always use "enable secret" — it hashes the password with MD5. "enable password" stores it in plaintext unless service password-encryption is also configured.' },
  { cat:'security', q:'Which ACL type filters based only on source IP address?',
    opts:['Extended ACL','Named ACL','Standard ACL','Reflexive ACL'], ans:2,
    explain:'Standard ACLs (numbered 1–99, 1300–1999) match only on source IP. Extended ACLs can also match destination, protocol, and port.' },
];

let questions = [];
let current = 0;
let score = 0;
let answered = false;
let lastCategory = 'all';
let reviewData = [];

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function startQuiz(cat) {
  lastCategory = cat;
  const pool = cat === 'all' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.cat === cat);
  questions = shuffle(pool).slice(0, Math.min(20, pool.length));
  current = 0; score = 0; reviewData = [];
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('scoreScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[current];
  const total = questions.length;
  document.getElementById('progressBar').style.width = `${(current / total) * 100}%`;
  document.getElementById('questionCounter').textContent = `Question ${current + 1} of ${total}`;
  document.getElementById('questionCat').textContent = `// ${q.cat}`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('quizFeedback').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';

  const opts = document.getElementById('optionsContainer');
  opts.innerHTML = q.opts.map((o, i) =>
    `<button class="quiz-option" onclick="answer(${i})">${o}</button>`
  ).join('');
}

function answer(i) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const btns = document.querySelectorAll('.quiz-option');
  btns.forEach(b => b.disabled = true);

  const correct = i === q.ans;
  btns[i].classList.add(correct ? 'correct' : 'wrong');
  if (!correct) btns[q.ans].classList.add('correct');
  if (correct) score++;

  reviewData.push({ q: q.q, your: q.opts[i], correct: q.opts[q.ans], ok: correct, explain: q.explain });

  document.getElementById('quizFeedback').innerHTML =
    `<div class="feedback ${correct ? 'correct' : 'wrong'}">
      ${correct ? 'Correct!' : `Wrong — correct answer: <strong>${q.opts[q.ans]}</strong>`}<br>
      <span style="opacity:.85">${q.explain}</span>
    </div>`;

  document.getElementById('nextBtn').style.display = 'inline-flex';
  document.getElementById('nextBtn').textContent = current + 1 < questions.length ? 'Next →' : 'See Results';
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    renderQuestion();
  } else {
    showScore();
  }
}

function showScore() {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('scoreScreen').style.display = 'block';
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('finalScore').textContent = `${score}/${questions.length}`;
  document.getElementById('scoreLabel').textContent = `${pct}% correct`;
  const msgs = [
    [80, 'Excellent work! You clearly know your Cisco.'],
    [60, 'Good effort. Review the missed questions below.'],
    [0,  'Keep studying — use the guides and command library to fill the gaps.'],
  ];
  document.getElementById('scoreMsg').textContent = msgs.find(([t]) => pct >= t)[1];

  document.getElementById('reviewList').innerHTML = `
    <p class="section-label" style="margin-bottom:1rem;">// review</p>
    ${reviewData.map((r, i) => `
      <div class="card" style="margin-bottom:.75rem;border-color:${r.ok ? 'rgba(74,222,128,0.2)' : 'rgba(248,113,113,0.2)'};">
        <p style="font-size:.78rem;font-family:'JetBrains Mono',monospace;color:${r.ok ? 'var(--green)' : 'var(--red)'};margin-bottom:.4rem;">${r.ok ? '✓ correct' : '✗ wrong'}</p>
        <p style="font-size:.9rem;margin-bottom:.5rem;font-weight:500;">${r.q}</p>
        ${!r.ok ? `<p style="font-size:.83rem;color:var(--muted);">Your answer: <span style="color:var(--red)">${r.your}</span> — Correct: <span style="color:var(--green)">${r.correct}</span></p>` : ''}
        <p style="font-size:.82rem;color:var(--muted);margin-top:.4rem;">${r.explain}</p>
      </div>
    `).join('')}
  `;
}

function showStart() {
  document.getElementById('scoreScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'block';
}
</script>
</body>
</html>
